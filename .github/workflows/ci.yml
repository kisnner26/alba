name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  boot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: instalar qemu
        run: sudo apt-get update && sudo apt-get install -y qemu-system-arm
      - name: test de arranque
        env:
          ALBA_PRESUPUESTOS_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: ./tests/boot.sh
