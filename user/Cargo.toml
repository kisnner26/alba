[package]
name = "alba-user"
version = "0.0.1"
edition = "2021"

# biblioteca minima de programas de usuario: llamadas al sistema e impresion.
# es el embrion de la biblioteca estandar de alba.
[lib]
name = "alba"
path = "src/lib.rs"

[[bin]]
name = "hola"
path = "src/bin/hola.rs"

[[bin]]
name = "eco"
path = "src/bin/eco.rs"

[[bin]]
name = "lanzador"
path = "src/bin/lanzador.rs"

[[bin]]
name = "intruso"
path = "src/bin/intruso.rs"

[[bin]]
name = "intruso2"
path = "src/bin/intruso2.rs"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = 2
