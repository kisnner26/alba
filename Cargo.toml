[package]
name = "alba"
version = "0.0.1"
edition = "2021"

[features]
crash-test = []
gpu-panic-test = []
# tareas y programas de prueba al arrancar (los usa tests/boot.sh); sin ella se va directo a la shell
autotest = []
# intenta escribir en el texto del kernel: debe fallar por W^X
wx-test = []

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = "s"
lto = "fat"
codegen-units = 1
